kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["sh", "-c", "PLAYWRIGHT_BROWSERS_PATH=0 pnpm --filter @workspace/api-server run build && PLAYWRIGHT_BROWSERS_PATH=0 pnpm --filter @workspace/api-server exec playwright install chromium"]

[services.production.build.env]
NODE_ENV = "production"
PLAYWRIGHT_BROWSERS_PATH = "0"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
PLAYWRIGHT_BROWSERS_PATH = "0"

[services.production.health.startup]
path = "/api/healthz"
